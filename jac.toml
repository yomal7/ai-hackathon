[project]
name = "rakshaka"
version = "0.1.0"
description = "Rakshaka - an AI agent network that stops scammers from emptying elders' bank accounts (simulation)"
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
python-dotenv = ">=1.0.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

# The graph topology index makes every edge write re-encode the whole graph (O(edges^2) seeding)
# and every typed read decode it (~12 ms). Our graph is small and in memory: walking edges is faster.
[run]
topology_index = false

[test]
directory = "tests"

[plugins.client.app_meta_data]
title = "Rakshaka (simulation)"

[plugins.byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
